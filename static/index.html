<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask your documents</title>
<style>
:root{
  --paper:#f6f7fb; --card:#ffffff; --ink:#18202f; --muted:#5d6879; --line:#dde2ec;
  --blue:#2a56e8; --blue-soft:#e8eeff; --mark:#ffe14d; --mark-ink:#3a3000; --err:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#11151d; --card:#181e29; --ink:#e8ecf4; --muted:#98a3b6; --line:#2a3242;
        --blue:#8aa6ff; --blue-soft:#1e2842; --mark:#e6c72e; --mark-ink:#1d1800; --err:#ff8a80;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
header{max-width:760px;width:100%;margin:0 auto;padding:28px 20px 8px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
main{flex:1;overflow-y:auto}
.wrap{max-width:760px;margin:0 auto;padding:12px 20px 24px}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus,.drop:focus-within{outline:2px solid var(--blue);outline-offset:2px}

.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;
  background:var(--card);cursor:pointer;margin-top:16px}
.drop.over,.drop:hover{border-color:var(--blue);background:var(--blue-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop b{display:block;font-size:18px;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}

.prog{margin-top:28px}
.prog p{margin:0 0 10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
.names{color:var(--muted);font-size:14px;margin-top:10px;overflow-wrap:anywhere}

.filebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.file{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:2px 9px;font-size:13.5px;overflow-wrap:anywhere}
.link{background:none;border:0;color:var(--blue);padding:2px 4px;font-size:14px;text-decoration:underline}
.note{margin:10px 0 0;font-size:14px;color:var(--err)}
.hello{color:var(--muted);margin-top:24px}

.turn{margin-top:28px}
.q{font-size:18px;font-weight:600;margin:0 0 10px;overflow-wrap:anywhere}
.a{border-left:3px solid var(--blue);padding:2px 0 2px 16px;max-width:68ch}
.a p{margin:0 0 .75em}.a h4{margin:1em 0 .4em}
.a ul,.a ol{margin:0 0 .75em;padding-left:1.3em}
.a code{background:var(--blue-soft);padding:1px 5px;border-radius:4px;font:.9em ui-monospace,Consolas,monospace}
.a pre{background:var(--blue-soft);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:0 0 .75em}
.a pre code{background:none;padding:0}
.a.miss{border-color:var(--line);color:var(--muted)}
.a.err{border-color:var(--err);color:var(--err)}
.src{margin:12px 0 0 19px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chip{background:var(--mark);color:var(--mark-ink);padding:2px 9px;border-radius:3px;font-size:13.5px;
  box-shadow:0 1px 0 rgba(0,0,0,.12);cursor:default;overflow-wrap:anywhere}
.chip small{opacity:.7;margin-left:6px}
.wait{color:var(--muted)}
.wait::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion:reduce){.wait::after{animation:none;content:"..."}.bar i{transition:none}}

footer{background:var(--paper);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0))}
form{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
textarea{flex:1;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;resize:none;max-height:140px;min-height:44px}
#send{font-weight:600;color:#fff;background:var(--blue);border:0;border-radius:10px;padding:0 20px;height:44px}
@media (prefers-color-scheme:dark){#send{color:#0b1020}}
#send:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header>
  <h1>Ask your documents</h1>
  <p>Upload your files, wait for them to be indexed, then ask questions. Answers come only from your files.</p>
</header>

<main id="scroll"><div class="wrap">
  <p class="note" id="note" role="alert" hidden></p>

  <section id="upload" hidden>
    <label class="drop" id="drop">
      <input type="file" id="pick" multiple accept=".pdf,.txt,.md,.docx">
      <b>Drop files here or choose files</b>
      <span>PDF, TXT, MD or DOCX. Up to 10 files, 25 MB each.</span>
    </label>
  </section>

  <section id="progress" class="prog" hidden>
    <p id="stage" aria-live="polite">Uploading</p>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
    <div class="names" id="names"></div>
  </section>

  <section id="chat" hidden>
    <div class="filebar" id="files"></div>
    <div class="filebar">
      <button class="link" id="add" type="button">Add files</button>
      <button class="link" id="reset" type="button">Start over</button>
      <input type="file" id="more" multiple accept=".pdf,.txt,.md,.docx" hidden>
    </div>
    <p class="hello" id="hello"></p>
    <div id="turns"></div>
  </section>
</div></main>

<footer id="composer" hidden>
  <form id="form">
    <textarea id="box" rows="1" placeholder="Ask about your files" aria-label="Your question"></textarea>
    <button id="send" type="submit">Ask</button>
  </form>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');

function md(text){
  const out=[]; let list=null, code=null;
  const flush=()=>{ if(list){ out.push(`<${list.t}>${list.i.join('')}</${list.t}>`); list=null; } };
  const item=(t,s)=>{ if(!list||list.t!==t){ flush(); list={t,i:[]}; } list.i.push(`<li>${inline(s)}</li>`); };
  for(const line of text.split('\n')){
    if(line.trim().startsWith('```')){
      if(code===null){ flush(); code=[]; } else { out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code=null; }
      continue;
    }
    if(code!==null){ code.push(line); continue; }
    let m;
    if((m=line.match(/^\s*[-*\u2022]\s+(.*)/))) item('ul',m[1]);
    else if((m=line.match(/^\s*\d+[.)]\s+(.*)/))) item('ol',m[1]);
    else { flush(); if(!line.trim()) continue;
      m=line.match(/^#{1,6}\s+(.*)/); out.push(m?`<h4>${inline(m[1])}</h4>`:`<p>${inline(line)}</p>`); }
  }
  flush(); if(code!==null) out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  return out.join('');
}

let ws = localStorage.getItem('ws'), timer = null;
const view = v => { for(const id of ['upload','progress','chat']) $(id).hidden = id!==v; $('composer').hidden = v!=='chat'; };
const note = msg => { $('note').textContent = msg||''; $('note').hidden = !msg; };
const detail = d => typeof d.detail==='string' ? d.detail : 'Something went wrong. Check the server terminal.';
const netErr = e => e instanceof TypeError ? 'Can\u2019t reach the server. Make sure uvicorn is running.' : e.message;

function setProgress(stage, p, names){
  $('stage').textContent = stage;
  $('fill').style.width = Math.round(p*100)+'%';
  document.querySelector('.bar').setAttribute('aria-valuenow', Math.round(p*100));
  if(names) $('names').textContent = names.join(', ');
}

async function upload(fileList){
  const files=[...fileList]; if(!files.length) return;
  const fd=new FormData(); files.forEach(f=>fd.append('files',f)); if(ws) fd.append('workspace',ws);
  note(''); view('progress'); setProgress('Uploading', .02, files.map(f=>f.name));
  try{
    const r=await fetch('/api/upload',{method:'POST',body:fd});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(detail(d));
    ws=d.workspace; localStorage.setItem('ws',ws); poll();
  }catch(e){ note(netErr(e)); ws ? poll() : view('upload'); }
}

async function poll(){
  clearTimeout(timer);
  if(!ws){ view('upload'); return; }
  try{
    const r=await fetch('/api/status/'+ws);
    if(r.status===404){ clearWorkspace(); return; }
    const s=await r.json();
    if(s.state==='processing'){ view('progress'); setProgress(s.stage, s.progress); timer=setTimeout(poll,800); }
    else if(s.state==='error'){ note(s.error); clearWorkspace(true); }
    else enterChat(s);
  }catch(e){ note('Lost connection to the server. Retrying.'); timer=setTimeout(poll,2000); }
}

function enterChat(s){
  view('chat');
  $('files').innerHTML = s.files.map(f=>`<span class="file">${esc(f)}</span>`).join('');
  $('hello').textContent = `Ask anything about your ${s.files.length} file${s.files.length>1?'s':''}.`;
  $('hello').hidden = $('turns').children.length>0;
  const msgs=[]; if(s.warning) msgs.push(s.warning); (s.skipped||[]).forEach(x=>msgs.push('Skipped '+x));
  if(msgs.length) note(msgs.join(' '));
  $('box').focus();
}

function clearWorkspace(keepNote){
  ws=null; localStorage.removeItem('ws'); $('turns').innerHTML=''; if(!keepNote) note('');
  view('upload');
}

$('pick').addEventListener('change',e=>{ upload(e.target.files); e.target.value=''; });
$('more').addEventListener('change',e=>{ upload(e.target.files); e.target.value=''; });
$('add').addEventListener('click',()=>$('more').click());
$('reset').addEventListener('click',async()=>{
  if(!confirm('Delete these files and start over?')) return;
  try{ await fetch('/api/workspace/'+ws,{method:'DELETE'}); }catch{}
  clearWorkspace();
});
const drop=$('drop');
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>upload(e.dataTransfer.files));

function turn(question){
  $('hello').hidden = true;
  const el=document.createElement('section'); el.className='turn';
  el.innerHTML=`<p class="q">${esc(question)}</p><div class="a wait">Searching your files</div>`;
  $('turns').appendChild(el); el.scrollIntoView({block:'start',behavior:'smooth'});
  return el;
}
function showAnswer(el,data){
  const a=el.querySelector('.a'); a.className='a';
  if(!data.sources.length) a.classList.add('miss');
  a.innerHTML=md(data.answer);
  if(data.sources.length){
    const s=document.createElement('div'); s.className='src';
    s.innerHTML='<span>From</span>'+data.sources.map(x=>
      `<span class="chip" title="${esc(x.snippet)}">${esc(x.source)}${x.page?', p'+x.page:''}<small>${x.score.toFixed(2)}</small></span>`).join('');
    el.appendChild(s);
  }
}
function showError(el,msg){ const a=el.querySelector('.a'); a.className='a err'; a.textContent=msg; }

async function ask(question){
  const el=turn(question); $('send').disabled=true;
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({workspace:ws,question})});
    const data=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(detail(data));
    showAnswer(el,data);
  }catch(e){ showError(el,netErr(e)); }
  finally{ $('send').disabled=false; $('box').focus(); }
}
function submit(){
  const q=$('box').value.trim(); if(q.length<2||$('send').disabled) return;
  $('box').value=''; $('box').style.height='auto'; ask(q);
}
$('form').addEventListener('submit',e=>{e.preventDefault();submit();});
$('box').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();} });
$('box').addEventListener('input',e=>{ e.target.style.height='auto'; e.target.style.height=e.target.scrollHeight+'px'; });

poll();
</script>
</body>
</html>
